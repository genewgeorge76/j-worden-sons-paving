<form id="lead-form" class="premium-form">
    <div class="form-group">
        <input type="text" name="customer_name" placeholder="Full Name" required>
        <input type="email" name="customer_email" placeholder="Email Address" required>
    </div>
    <div class="form-group">
        <input type="tel" name="customer_phone" placeholder="Phone Number" required>
        <select name="service_type">
            <option value="asphalt_paving">Asphalt Paving</option>
            <option value="sealcoating">Sealcoating</option>
            <option value="repair">Crack Repair/Maintenance</option>
        </select>
    </div>
    <textarea name="job_description" placeholder="Describe your project (e.g., Driveway in Richmond)"></textarea>
    
    <input type="hidden" name="source_url" id="source_url">
    
    <button type="submit" class="btn-premium">Get My Free Estimate</button>
</form>

<script>
    // Automatically tag the lead with the specific city page they are on
    document.getElementById('source_url').value = window.location.href;

    document.getElementById('lead-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        // This is where we point to your Netlify Function (Step 3) for secure Kickserv delivery
        const response = await fetch('/.netlify/functions/send-to-kickserv', {
            method: 'POST',
            body: JSON.stringify(Object.fromEntries(formData))
        });
        if(response.ok) alert('Estimate Request Sent! We will contact you shortly.');
    });
</script>
