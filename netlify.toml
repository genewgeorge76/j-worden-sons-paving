# J. WORDEN & SONS - PREMIUM NETLIFY CONFIGURATION

[build]
  publish = "/"
  functions = "netlify/functions"

# HIGH-SPEED PERFORMANCE HEADERS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=31536000"

# KICKSERV API GATEWAY
[[redirects]]
  from = "/api/send-to-kickserv"
  to = "/.netlify/functions/send-to-kickserv"
  status = 200

# CUSTOM 404 PAGE
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
